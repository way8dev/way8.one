stages:
  - validate
  - lint

variables:
  PHP_VERSION: "8.1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer"

# Validate composer.json and composer.lock
validate:composer:
  stage: validate
  image: composer:2
  script:
    - composer validate --strict

# Run PHPCS
lint:phpcs:
  stage: lint
  image: php:8.1
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq git unzip libpng-dev
    - docker-php-ext-install gd
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
    - composer require --dev squizlabs/php_codesniffer dealerdirect/phpcodesniffer-composer-installer drupal/coder:^8.3 slevomat/coding-standard:^8.0
    - vendor/bin/phpcs --config-set installed_paths vendor/drupal/coder/coder_sniffer,vendor/slevomat/coding-standard
  script:
    - vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme,yml --ignore=vendor,.gitlab-ci-local .  